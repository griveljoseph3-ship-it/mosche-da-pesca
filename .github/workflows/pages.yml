name: Pubblica su GitHub Pages

# Costruisce il sito e lo pubblica sul branch gh-pages, che GitHub Pages serve così com'è.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      # Le foto WebP/AVIF sono già in public/ (npm run assets).
      - name: Costruisci il sito (base /mosche-da-pesca/)
        run: npm run build

      - name: Pubblica dist/ sul branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Pubblica il sito'
