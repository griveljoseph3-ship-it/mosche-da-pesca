<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosche da Pesca · In costruzione</title>
<meta name="description" content="Mosche da pesca artigianali. Il sito è in costruzione.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root{--verde:#16261c;--crema:#f3ead8;--rame:#b87333;--nero:#0b0d0c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--nero);color:var(--crema);font-family:Inter,system-ui,sans-serif}
.hero{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;text-align:center;padding:6vh 6vw}
.bg{position:absolute;inset:-4%;background:url("assets/foto/fiumi-ambientazioni/torrente-bosco-oirase.jpg") center/cover;filter:saturate(.85) brightness(.55);animation:respiro 24s ease-in-out infinite alternate}
.velo{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(243,234,216,.10),transparent 60%),linear-gradient(180deg,rgba(11,13,12,.2),rgba(22,38,28,.75) 70%,var(--nero))}
.nebbia{position:absolute;left:-20%;right:-20%;bottom:18%;height:30vh;background:radial-gradient(ellipse at center,rgba(243,234,216,.18),transparent 70%);filter:blur(30px);animation:deriva 30s linear infinite alternate}
.contenuto{position:relative;max-width:900px}
.sopra{letter-spacing:.35em;text-transform:uppercase;font-size:.75rem;color:var(--rame);margin-bottom:1.2rem;opacity:0;animation:entra 1.6s .2s forwards}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(2.8rem,8vw,6.5rem);line-height:1;opacity:0;animation:entra 1.8s .5s forwards}
h1 em{color:var(--rame);font-style:italic}
p.testo{max-width:560px;margin:1.6rem auto 0;font-weight:300;line-height:1.7;color:rgba(243,234,216,.8);opacity:0;animation:entra 1.8s .9s forwards}
model-viewer{width:min(560px,90vw);height:min(340px,48vw);margin:2rem auto 0;--poster-color:transparent;opacity:0;animation:entra 2s 1.2s forwards}
.badge{display:inline-block;margin-top:1.4rem;padding:.7rem 1.4rem;border:1px solid rgba(184,115,51,.6);border-radius:999px;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--crema)}
.cerchi{position:absolute;left:50%;bottom:12%;width:2px;height:2px}
.cerchi i{position:absolute;left:-60px;top:-20px;width:120px;height:40px;border:1px solid rgba(243,234,216,.35);border-radius:50%;animation:onda 4s ease-out infinite}
.cerchi i:nth-child(2){animation-delay:1.3s}.cerchi i:nth-child(3){animation-delay:2.6s}
footer{position:relative;padding:2rem 6vw 3rem;text-align:center;font-size:.75rem;color:rgba(243,234,216,.55);background:var(--nero)}
footer a{color:var(--rame)}
@keyframes entra{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes respiro{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes deriva{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
@keyframes onda{from{transform:scale(.2);opacity:.9}to{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
<section class="hero">
  <div class="bg" aria-hidden="true"></div><div class="velo" aria-hidden="true"></div><div class="nebbia" aria-hidden="true"></div>
  <div class="cerchi" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="contenuto">
    <div class="sopra">Mosche da pesca artigianali</div>
    <h1>Il <em>fiume</em><br>sta arrivando</h1>
    <p class="testo">Stiamo costruendo un negozio diverso da tutti gli altri: un viaggio in un torrente di montagna, dall'alba al tramonto.</p>
    <model-viewer src="assets/3d/modelli/mosca-secca-stilizzata/mosca-secca.glb" alt="Mosca secca in 3D" camera-controls auto-rotate rotation-per-second="18deg" shadow-intensity="0.6" exposure="1.1" camera-orbit="-30deg 75deg 2.6m" disable-zoom interaction-prompt="none"></model-viewer>
    <div class="badge">In costruzione</div>
  </div>
</section>
<footer>Foto: “Oirase Mountain Stream” di Daderot, CC0, via <a href="https://commons.wikimedia.org/wiki/File:Oirase_Mountain_Stream_-_Towada,_Aomori_-_DSC00943.jpg">Wikimedia Commons</a>. Modello 3D della mosca: CC0. Sito demo.</footer>
</body>
</html>
